name: sn-pull-sync - Pull instance changes into mydev

# Manual. Runs `now-sdk transform` (no --from) against DEV or PROD, which reads the
# app's metadata from the instance and rewrites the matching Fluent (.now.ts) files.
# Use it after editing something directly on the instance (a flow, an ACL, a form
# layout) so git stays the single source of truth.
#
# Run it from the Actions tab: "Use workflow from" = mydev.
#   dry_run = true  (default): shows what would change, commits nothing.
#   dry_run = false: commits the changes to mydev.
# Then `git pull origin mydev` locally, review, and deploy with `git push origin mydev:nowdev`.
#
# Choosing "prod" uses the production environment (its secrets).
on:
  workflow_dispatch:
    inputs:
      instance:
        description: Instance to pull from
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      dry_run:
        description: Preview only. Show the changes, do not commit or push.
        required: true
        default: true
        type: boolean

concurrency:
  group: sn-pull-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pull:
    name: Transform ${{ inputs.instance }} into mydev
    runs-on: ubuntu-latest
    environment: ${{ inputs.instance == 'prod' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mydev
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # transform overwrites local files for every record it updates. The checkout
      # is clean, so nothing local is lost here. To protect a statement you want
      # managed from code only, mark it with `// @fluent-disable-sync`.
      # The script tolerates ONE known SDK 4.14.0 failure (now.config.json) and
      # marks the run partial; see .github/scripts/run-transform.sh.
      - name: Transform from DEV
        id: transform_dev
        if: inputs.instance == 'dev'
        env:
          SN_SDK_NODE_ENV: SN_SDK_CI_INSTALL
          SN_SDK_AUTH_TYPE: basic
          SN_SDK_INSTANCE_URL: ${{ secrets.SN_DEV_INSTANCE }}
          SN_SDK_USER: ${{ secrets.SN_DEV_USER }}
          SN_SDK_USER_PWD: ${{ secrets.SN_DEV_PASS }}
        run: bash .github/scripts/run-transform.sh

      - name: Transform from PROD
        id: transform_prod
        if: inputs.instance == 'prod'
        env:
          SN_SDK_NODE_ENV: SN_SDK_CI_INSTALL
          SN_SDK_AUTH_TYPE: basic
          SN_SDK_INSTANCE_URL: ${{ secrets.SN_PROD_INSTANCE }}
          SN_SDK_USER: ${{ secrets.SN_PROD_USER }}
          SN_SDK_USER_PWD: ${{ secrets.SN_PROD_PASS }}
        run: bash .github/scripts/run-transform.sh

      - name: Show changes
        env:
          PARTIAL: ${{ steps.transform_dev.outputs.partial || steps.transform_prod.outputs.partial }}
        run: |
          git add -A
          {
            echo "## sn-pull-sync from ${{ inputs.instance }}"
            echo
            if [ "$PARTIAL" = "true" ]; then
              echo "> PARTIAL run: transform hit a known SDK error on now.config.json."
              echo "> The file list below is a preview of what DEV serves. It cannot be committed."
              echo
            fi
            if git diff --cached --quiet; then
              echo "No changes. mydev already matches the instance."
            else
              echo "Changed files:"
              echo
              echo '```'
              git diff --cached --stat
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The repo is public, so the artifact leaves out src/fluent and
      # now.config.json, which can carry instance property values.
      - name: Upload full diff
        if: always()
        run: git diff --cached -- . ':!src/fluent' ':!now.config.json' > sn-pull.diff || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sn-pull-diff
          path: sn-pull.diff
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit and push to mydev
        if: inputs.dry_run == false
        env:
          SOURCE: ${{ inputs.instance }}
          PARTIAL: ${{ steps.transform_dev.outputs.partial || steps.transform_prod.outputs.partial }}
        run: |
          if [ "$PARTIAL" = "true" ]; then
            echo "::error::Refusing to commit: the transform run was partial."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No changes from $SOURCE; mydev is already up to date."
          else
            git commit -m "sync: pull from ServiceNow $SOURCE on $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin mydev
            git push origin mydev
          fi
